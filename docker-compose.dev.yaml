services:
  api:
    environment:
      DEBUG: "true"
    volumes:
      - "./src/conode/:/conode/src/conode/"

  postgres:
    ports:
      - 5432:5432

  jaeger-query:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observability.rule=Host(`observability.conode.com`)"
      - "traefik.http.routers.observability.entrypoints=web"
      - "traefik.http.services.observability.loadbalancer.server.port=16686"

  traefik:
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"