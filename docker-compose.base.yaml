services:
  api:
    build: .

    restart: on-failure
    command: ["conode", "api", "run"]

    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.grafana.rule=Host(`api.conode.com`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=8000"

    networks:
      - conode-network

  migrations:
    build: .

    restart: on-failure
    command: ["conode", "migrations", "upgrade"]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - conode-network

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.grafana.rule=Host(`grafana.conode.com`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    networks:
      - conode-network

  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    networks:
      conode-network:
        aliases:
          - api.conode.com

  postgres:
    image: postgres:16-alpine

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      conode-network:
        aliases:
          - persistence.literally.io

    env_file:
      - "./deploy/persistence/postgres.env"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "conode", "-d", "conode"]
      interval: 5s
      timeout: 15s
      retries: 5

  alloy:
    image: grafana/alloy:latest
    profiles: ["observability"]

    volumes:
      - ./deploy/observability/grafana/config.alloy:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy/data

    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345

    networks:
      - conode-network


  prometheus:
    image: prom/prometheus
    profiles: ["observability"]

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

    volumes:
      - prometheus-data:/prometheus
      - ./deploy/observability/grafana/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - conode-network


  tempo:
    image: grafana/tempo:latest
    profiles: ["observability"]

    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"

    restart: always

    volumes:
      - ./deploy/observability/grafana/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo

    networks:
      - conode-network


volumes:
  prometheus-data:
  postgres-data:
  tempo-data:
  alloy-data:

networks:
  conode-network:
    driver: bridge