services:
  api:
    build: .

    restart: on-failure
    command: ["conode", "api", "run"]

    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    networks:
      - conode-network

  migrations:
    build: .

    restart: on-failure
    command: ["conode", "migrations", "upgrade"]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - conode-network

  oauth:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.toml"]

    environment:
      OAUTH2_PROXY_CLIENT_ID: conode
      OAUTH2_PROXY_CLIENT_SECRET: RELW6bj1AsUr3yQUmc4Nn3y5mGfS6qzjD7tCnkIuekGa9mMmU9B6vuCFVyvUL9mBDrRUJVVPSe42hTzbFN6Vqi
      OAUTH2_PROXY_COOKIE_SECRET: x3CpXUQxfDgXzDDxIdST3mTbTDosKOlx

    volumes:
      - "./deploy/oauth_proxy.toml:/etc/oauth2-proxy/oauth2-proxy.toml"

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.oauth.rule=Host(`api.conode.com`)"
      - "traefik.http.routers.oauth.entrypoints=web"
      - "traefik.http.services.oauth.loadbalancer.server.port=4180"

    networks:
      - conode-network

    depends_on:
      keycloak:
        condition: service_healthy

  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    networks:
      conode-network:
        aliases:
          - keycloak.conode.com
          - api.conode.com

  keycloak:
    image: quay.io/keycloak/keycloak:latest

    command: start-dev --import-realm

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - "./deploy/keycloak/keycloak.env"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q '200'; } 0<>/dev/tcp/localhost/9000
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.conode.com`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

    volumes:
      - keycloak-data:/opt/keycloak/
      - ./deploy/keycloak/keycloak.json:/opt/keycloak/data/import/realm-export.json

    networks:
      - conode-network

  postgres:
    image: postgres:16-alpine

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/persistence:/docker-entrypoint-initdb.d:ro

    networks:
      conode-network:
        aliases:
          - persistence.literally.io

    env_file:
      - "./deploy/persistence/postgres.env"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "conode", "-d", "conode"]
      interval: 5s
      timeout: 15s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger

    environment:
      - COLLECTOR_OTLP_ENABLED=true

    restart: unless-stopped
    networks:
      - conode-network

  collector:
    image: otel/opentelemetry-collector:0.156.0
    command: --config=/etc/otelcol/config.yaml

    depends_on:
      - jaeger

    volumes:
      - ./deploy/observability/collector.yaml:/etc/otelcol/config.yaml:ro

    networks:
      - conode-network

volumes:
  postgres-data:
  keycloak-data:

networks:
  conode-network:
    driver: bridge